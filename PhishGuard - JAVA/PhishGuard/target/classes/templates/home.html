<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>PhishGuard — Home</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --navy:#060624; /* muito escuro */
      --navy-gradient-start:#0b0c2b;
      --navy-gradient-end:#0f1633;
      --accent:#0e0b26;
      --pill-bg:#0b1026;
      --pill-text:#ffffff;
      --muted:#bdbdc8;
      --blue-link:#1e5bff;
      --danger:#E53935;
      --success:#2e7d32;
      --card-dark:#05061a;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: "Inter", Arial, Helvetica, sans-serif;
      background: #ffffff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    /* phone frame */
    .phone{
      width:360px;
      height:780px;
      border-radius:28px;
      overflow:hidden;
      box-shadow: 0 8px 30px rgba(2,8,40,0.25);
      background: #fff;
      display:flex;
      flex-direction:column;
    }

    /* header with waves */
    .header{
      position:relative;
      background: linear-gradient(180deg, var(--navy-gradient-start) 0%, var(--navy-gradient-end) 100%);
      color:white;
      padding:22px 20px 40px 20px;
      height:170px;
    }
    .logo-row{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .brand-name{
      font-weight:700;
      letter-spacing:1px;
      font-size:22px;
    }
    .header .desc{
      margin-top:12px;
      color:#dfe3f4;
      font-size:14px;
      line-height:1.2;
      max-width:300px;
    }

    /* decorative wave (svg) sits at bottom of header */
    .wave {
      position:absolute;
      bottom:-8px;
      left:0;
      width:100%;
      height:64px;
      transform: translateY(2px);
    }

    /* content */
    .content{
      flex:1;
      background:#fff;
      padding:26px 20px 28px 20px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* search pill */
    .search-pill{
      width:100%;
      max-width:320px;
      height:44px;
      background:var(--pill-bg);
      color:var(--pill-text);
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 14px;
      border-radius:28px;
      border: 2px solid rgba(255,255,255,0.06);
      box-shadow: 0 4px 10px rgba(3,9,30,0.08);
      margin-top: -18px; /* pull up near the wave */
      margin-bottom:28px;
    }
    .search-pill input{
      background:transparent;
      border: none;
      outline:none;
      color: #f6f7fb;
      font-size:14px;
      width:100%;
    }
    .search-pill .icon{
      width:22px;height:22px;flex:0 0 22px;
    }

    /* central illustration */
    .illustration{
      margin-top:28px;
      margin-bottom:auto;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .illustration svg{width:120px;height:120px;opacity:0.95}

    /* main CTA */
    .cta {
      width:80%;
      max-width:320px;
      margin: 22px 0 8px 0;
    }
    .cta button{
      width:100%;
      background:var(--pill-bg);
      color:white;
      padding:12px 16px;
      border-radius:28px;
      font-weight:700;
      border:none;
      box-shadow: 0 6px 18px rgba(5,8,30,0.18);
      font-size:16px;
    }

    .bottom-link{
      color:var(--blue-link);
      margin-top:6px;
      font-size:13px;
      text-decoration:none;
      display:block;
      text-align:center;
    }

    /* small responsive touches */
    @media (max-width:420px){
      .phone{transform:scale(0.92)}
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="logo-row">
        <!-- cloud + magnifier logo (svg) -->
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden>
          <defs></defs>
          <g fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 15a4 4 0 0 1 4-4h1"></path>
            <path d="M11 9a4 4 0 1 1 0 8h-2"></path>
            <circle cx="17.5" cy="17.5" r="3.2" fill="white"></circle>
            <path d="M19.2 19.2l2.2 2.2" stroke="#0b0b1e"></path>
            <path d="M10 11.5l1.5-1.5" stroke="white" opacity="0.25"></path>
          </g>
        </svg>

        <div class="brand-name">PHISHGUARD</div>
      </div>

      <div class="desc">PhishGuard Descrição<br>xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</div>

      <!-- decorative wave SVG, similar shape to PDF -->
      <svg class="wave" viewBox="0 0 800 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 40 C120 10 260 60 400 40 C540 20 680 60 800 40 L800 80 L0 80 Z" fill="#cfcfd7" opacity="0.9"></path>
        <path d="M0 48 C120 18 260 68 400 48 C540 28 680 68 800 48 L800 80 L0 80 Z" fill="rgba(5,6,30,0.85)"></path>
      </svg>
    </div>

    <div class="content">
      <!-- search pill -->
      <form class="search-pill" action="/verificar" method="post" autocomplete="off">
        <!-- small brain icon left (svg) -->
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="#0b0b26"></circle>
          <path d="M7 12h10" stroke="#ff4d6d" stroke-width="1.6" stroke-linecap="round"></path>
        </svg>

        <input name="url" type="text" placeholder="Adicione aqui o link para a verificação" required />
        <!-- lupa (search) icon -->
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="6" stroke="#cfd7ff" stroke-width="1.6"></circle>
          <path d="M20 20l-4.5-4.5" stroke="#cfd7ff" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </form>

      <div class="illustration" aria-hidden>
        <!-- chain + magnifier illustration (inline svg) -->
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke="#0b0b26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M30 60c6-8 14-12 23-12 9 0 17 4 23 12" stroke="#0b0b26" stroke-width="3"></path>
            <path d="M55 85l22-22" stroke="#0b0b26" stroke-width="4"></path>
            <circle cx="82" cy="43" r="10" fill="#0b0b26"></circle>
            <path d="M86 47l18 18" stroke="#0b0b26" stroke-width="3"></path>
          </g>
        </svg>
      </div>

      <div class="cta">
        <button type="submit" form="none" onclick="document.querySelector('.search-pill').submit();">Ok, vamos lá!</button>
      </div>

      <a class="bottom-link" href="/">Voltar</a>
    </div>
  </div>
</body>
</html>
